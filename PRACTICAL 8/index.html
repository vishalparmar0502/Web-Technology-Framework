<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechMart Inventory</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <h1>TechMart Inventory</h1>

        <form id="productForm">
            <input type="hidden" id="productId">

            <label>Product ID
                <input id="code" required>
            </label>

            <label>Name
                <input id="name" required maxlength="80">
            </label>

            <label>Category
                <input id="category" required>
            </label>

            <label>Price
                <input id="price" type="number" min="0.01" step="0.01" required>
            </label>

            <label>Quantity
                <input id="quantity" type="number" min="0" required>
            </label>

            <label>Description
                <textarea id="description" maxlength="300"></textarea>
            </label>

            <button type="submit">Save product</button>
            <button type="button" id="reset">Clear</button>
        </form>

        <p id="status"></p>
        <div id="products"></div>
    </main>

    <script src="script.js"></script>
</body>
</html>
