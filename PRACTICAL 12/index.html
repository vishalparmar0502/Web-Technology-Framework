<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="CampusConnect student events portal">
    <title>CampusConnect | Student Events</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="header">
        <a class="brand" href="#">CampusConnect</a>
        <nav>
            <a href="#events">Events</a>
            <a href="#create">Add event</a>
        </nav>
    </header>

    <main>
        <section class="hero">
            <p class="eyebrow">Campus life, connected</p>
            <h1>Find your next campus moment.</h1>
            <p>Discover workshops, meetups and student activities.</p>
        </section>

        <section id="events">
            <div class="section-head">
                <h2>Upcoming events</h2>
                <input id="search" placeholder="Search events" aria-label="Search events">
            </div>

            <p id="status" aria-live="polite">Loading events...</p>
            <div id="eventList" class="event-grid"></div>
        </section>

        <section id="create">
            <h2>Suggest an event</h2>

            <form id="eventForm">
                <label>
                    Event title
                    <input id="title" maxlength="80" required>
                </label>

                <label>
                    Category
                    <input id="category" maxlength="40" required>
                </label>

                <label>
                    Date
                    <input id="date" type="date" required>
                </label>

                <label>
                    Location
                    <input id="location" maxlength="80" required>
                </label>

                <label>
                    Description
                    <textarea id="description" maxlength="300" required></textarea>
                </label>

                <button type="submit">Submit event</button>
            </form>
        </section>
    </main>

    <footer>
        CampusConnect student project
    </footer>

    <script src="script.js"></script>
</body>
</html>
